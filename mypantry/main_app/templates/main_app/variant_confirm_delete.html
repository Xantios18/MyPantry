{% extends "base.html" %}

{% block head %}
{% endblock head %}

{% block content %}
<h1>Delete Variant?</h1>
<h2>Are you sure you want to delete your variant for {{ variant.name }} ({{ variant.recipe.name }})?</h2>
<form action="" method="post">
    {% csrf_token %}
    <a href="{% url 'recipe-variant' variant.recipe.id variant.id %}">Cancel</a>
    <button type="submit">Yes - Delete</button>
</form>
{% endblock content %}
