{% extends "base.html" %}

{% block head %}
{% endblock head %}

{% block content %}
<h1>Delete Ingredient?</h1>
<h2>Are you sure you want to delete {{ ingredient.name }}?</h2>
<form action="" method="post">
    {% csrf_token %}
    <a href="{% url 'ingredient-details' ingredient.id %}">Cancel</a>
    <button type="submit">Yes - Delete</button>
</form>
{% endblock content %}
