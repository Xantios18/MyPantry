{% extends "base.html" %}

{% block head %}
{% endblock head %}

{% block content %}
<h1>All Recipes</h1>
<div>
    {% if user.is_authenticated %}
    <a href="{% url 'add-recipe' %}">Create New Recipe</a>
    {% endif %}
</div>
<section>
    <ul>
        {% for recipe in recipe_list %}
            <li><a href="{% url 'recipe-details' recipe.id %}">{{ recipe.name }}</a></li>
        {% endfor %}
    </ul>
</section>
{% endblock content %}
