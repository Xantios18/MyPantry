{% extends "base.html" %}

{% block head %}
{% endblock head %}

{% block content %}
<h1>Delete Recipe?</h1>
<h2>Are you sure you want to delete your recipe for {{ recipe.name }}?</h2>
<form action="" method="post">
    {% csrf_token %}
    <a href="{% url 'recipe-details' recipe.id %}">Cancel</a>
    <button type="submit">Yes - Delete</button>
</form>
{% endblock content %}
