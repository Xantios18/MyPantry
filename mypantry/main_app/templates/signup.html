{% extends "base.html" %}

{% block head %}
{% endblock head %}

{% block content %}
<h1>Sign Up</h1>
<div>
    {% if error_message %}
    <p>{{error_message}}</p>
    {% endif %}
    <form action="" method = "post" class="form-container" autocomplete="off">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <button type="submit" class="btn submit">Submit</button>
    </form>
</div>
{% endblock content %}
